# 패턴 사전 (PLAN.md 7장). 수치 기준은 모두 여기서 관리한다.
# Phase 0/1: 1, 3, 7, 9, 18 다섯 개만 활성.
scene_filter:
  start: "2020-01-01"
  end: "2025-12-31"
  min_tv_eok: 10          # 멈춘 날 거래대금 10억 원 이상
  min_gap_days: 20        # 같은 종목 장면 간 최소 간격 (거래일)

patterns:
  new_high:
    num: 1
    name: 120일 신고가 돌파
    key_tags: [신고가 돌파, 거래대금 급증]
    lookback: 120
    tv_mult: 2.0
    desc: 종가가 직전 120거래일 고가를 넘어서고, 거래대금이 20일 평균의 2배 이상인 날
  box_breakout:
    num: 3
    name: 박스권 돌파
    key_tags: [박스권 돌파]
    box_days: 40
    max_range_pct: 15
    desc: 직전 40거래일 고저폭이 15% 이내인 박스에서 종가가 박스 상단을 넘어선 날
  gap_up:
    num: 7
    name: 갭상승
    key_tags: [거래대금 급증]
    gap_pct: 5
    desc: 시가가 전일 종가보다 5% 이상 높게 시작한 날
  ma20_pullback:
    num: 9
    name: 20일선 눌림
    key_tags: [이평선 지지, 거래대금 감소]
    recent_high_days: 10
    high_window: 20
    ma_band_pct: 2
    tv_mult_max: 0.7
    desc: 최근 10일 안에 20일 고점을 갱신한 뒤, 저가가 20일선 ±2% 안으로 내려오고 거래대금이 20일 평균의 0.7배 미만인 날
  dry_sideways:
    num: 18
    name: 거래대금 고갈 횡보
    key_tags: [거래대금 감소]
    tv_ratio_max: 0.5
    range_days: 20
    max_range_pct: 8
    desc: 최근 20일 평균 거래대금이 60일 평균의 절반 미만이고, 20일 고저폭이 8% 이내인 횡보 구간

sampling:
  per_horizon:           # 패턴마다 판정 기간별 출제 수
    1: 100
    3: 50
    5: 100
