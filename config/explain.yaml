# 해설 템플릿 (PLAN.md 6.5). 숫자는 09_explain.py 가 넣는다. 단정 표현("반드시", "무조건") 금지.
outcome: "이 종목은 T+{h}에 {chg:+.2f}%로 마감했어요 (보합 범위 ±{band:.1f}%)."
patterns:
  new_high:
    obs: "120일 고점을 {brk:.1f}% 넘어섰고, 돌파일 거래대금이 20일 평균의 {tvx:.1f}배였어요."
    up: "거래대금이 실린 돌파는 위쪽 매물을 소화했다는 신호로 읽히곤 해요."
    flat: "돌파 직후에는 고점 부근에서 숨을 고르며 방향을 정하지 못하는 경우도 흔해요."
    down: "돌파 당일 매수가 몰린 만큼, 이후 차익 실현 매물이 나오며 되밀리는 경우도 적지 않아요."
  box_breakout:
    obs: "40일 동안 고저폭 {box_rng:.1f}% 안에서 움직이던 박스 상단을 종가 기준 {box_brk:.1f}% 넘어섰어요. 거래대금은 20일 평균의 {tvx:.1f}배였어요."
    up: "오래 눌려 있던 박스를 벗어나면 새 추세의 시작으로 이어지는 경우가 있어요."
    flat: "돌파한 박스 상단이 지지선 역할을 하며 그 부근에서 머무는 경우가 많아요."
    down: "거래대금이 충분하지 않은 돌파는 다시 박스 안으로 돌아오는 '가짜 돌파'가 되기도 해요."
  gap_up:
    obs: "전일 종가보다 {gap:.1f}% 높게 시작해 {day_chg:+.1f}%로 마감했고, 거래대금은 20일 평균의 {tvx:.1f}배였어요."
    up: "갭을 메우지 않고 버틴 날은 매수세가 이어지는 경우가 있어요."
    flat: "갭 이후에는 갭 구간을 시험하며 옆으로 움직이는 경우도 흔해요."
    down: "갭으로 시작한 날 이후에는 갭을 메우려는 되돌림이 나오는 경우가 적지 않아요."
  ma20_pullback:
    obs: "최근 20일 고점을 갱신한 뒤 저가가 20일선 대비 {ma_dist:+.1f}% 지점까지 내려왔고, 거래대금은 20일 평균의 {tvx:.1f}배로 줄었어요."
    up: "조정 중 거래대금이 줄어드는 것은 매도 압력이 약하다는 신호로 읽히곤 해요."
    flat: "20일선 부근에서 지지 여부를 확인하며 옆으로 움직이는 경우도 많아요."
    down: "20일선 지지가 실패하면 조정이 더 깊어지기도 해요."
  dry_sideways:
    obs: "최근 20일 평균 거래대금이 60일 평균의 {dry:.0%}에 그쳤고, 20일 고저폭은 {rng20:.1f}%로 좁았어요."
    up: "오래 조용하던 횡보 끝에 거래대금이 붙으면 위로 방향을 잡기도 해요."
    flat: "관심이 식은 종목은 특별한 재료 없이 같은 범위에서 머무는 경우가 많아요. 보합을 고를 줄 아는 것도 실력이에요."
    down: "거래대금이 마른 상태에서는 작은 매도에도 아래로 밀리기 쉬워요."
